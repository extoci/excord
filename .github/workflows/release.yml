name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The release tag must match package.json version $version" >&2
            exit 1
          fi
  build:
    needs: validate
    uses: ./.github/workflows/native-build.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: excord-*
          path: release
          merge-multiple: true
      - name: Prepare release
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_DRAFT: ${{ steps.release.outputs.draft }}
        shell: bash
        run: |
          args=("$RELEASE_TAG" --title "Excord $RELEASE_TAG" --generate-notes --target "$GITHUB_SHA")
          if [[ "$RELEASE_DRAFT" == true ]]; then args+=(--draft); fi
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}" release/*

name: Native builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            runner: macos-26
            platform: mac
            arch: arm64
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: bun run check
      - run: bun run typecheck:reference
      - run: bun run build
      - name: Exercise the RPC worker
        run: bun run test:rpc
      - name: Exercise local plugins in Electron
        timeout-minutes: 5
        run: bun run test:electron
      - name: Build installer and archive
        run: bun x electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Exercise the packaged application archive
        run: bun run check:package
      - name: Verify shutdown without an inspector
        timeout-minutes: 2
        run: node --import tsx scripts/quit-smoke.mts --packaged
      - name: Exercise local plugins from the packaged archive
        timeout-minutes: 5
        run: bun run test:electron --packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: excord-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

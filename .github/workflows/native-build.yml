name: Native builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Verify release packaging with the persistent Mac signing certificate
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign_macos:
        description: Require the persistent self-signed certificate for release artifacts
        type: boolean
        default: false
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            runner: macos-26
            platform: mac
            arch: arm64
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Development builds use ad-hoc signing without secrets, including on PRs.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Verify self-signed Mac update compatibility without Apple credentials
        if: matrix.platform == 'mac'
        timeout-minutes: 2
        run: node --import tsx scripts/mac-update-signing-smoke.mts
      - run: bun run check
      - run: bun run typecheck:reference
      - run: bun run build
      - name: Verify Developer Portal isolation and lifecycle
        timeout-minutes: 2
        run: node --import tsx scripts/portal-smoke.mts
      - name: Exercise the RPC worker
        run: bun run test:rpc
      - name: Build installer and archive
        if: matrix.platform != 'mac' || !inputs.sign_macos
        run: bun x electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Build signed Mac release installer and archive
        if: matrix.platform == 'mac' && inputs.sign_macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          node --import tsx scripts/trust-mac-update-certificate.mts
          bun x electron-builder --mac --arm64 --publish never --config scripts/build/mac-release.cjs
      - name: Verify single-track updater metadata
        run: node --import tsx scripts/check-update-metadata.mts
      - name: Verify Mac release update signing compatibility
        if: matrix.platform == 'mac' && inputs.sign_macos
        env:
          EXCORD_MAC_SIGNING_CERTIFICATE: ${{ runner.temp }}/excord-update-certificate.pem
        run: node --import tsx scripts/check-mac-update-signing.mts
      - name: Exercise the packaged application archive
        run: bun run check:package
      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/js/*.js
            dist/js/*.css
            dist/js/*.map
            static/runtime/*.js
            static/runtime/*.css
            static/runtime/*.map
            static/runtime/modules.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify shutdown without an inspector
        timeout-minutes: 2
        run: node --import tsx scripts/quit-smoke.mts --packaged --refresh
      - name: Verify archive shutdown without an inspector
        timeout-minutes: 2
        run: node --import tsx scripts/quit-smoke.mts --archive --refresh
      - name: Verify installer, reinstallation, and session persistence
        timeout-minutes: 7
        run: node --import tsx scripts/install-smoke.mts
      - name: Exercise local plugins in Electron
        timeout-minutes: 5
        run: bun run test:electron
      - name: Exercise local plugins from the packaged archive
        timeout-minutes: 5
        run: bun run test:electron --packaged
      - name: Verify safe mode, offline recovery, and private diagnostics
        timeout-minutes: 4
        run: node --import tsx scripts/recovery-smoke.mts
      - name: Repeat profile reuse and recovery checks
        timeout-minutes: 4
        run: node --import tsx scripts/recovery-smoke.mts
      - name: Verify hidden efficiency, real WebRTC, and subframe isolation
        timeout-minutes: 3
        run: node --import tsx scripts/power-smoke.mts --packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: excord-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
            dist/alpha*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

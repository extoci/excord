name: Native builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Verify release packaging with the persistent Mac signing certificate
        type: boolean
        default: false
      favorites_dev_release:
        description: Publish Favorites test ZIPs as DEV DO NOT INSTALL
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign_macos:
        description: Require the persistent self-signed certificate for release artifacts
        type: boolean
        default: false
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            runner: macos-26
            platform: mac
            arch: arm64
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Development builds use ad-hoc signing without secrets, including on PRs.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Verify self-signed Mac update compatibility without Apple credentials
        if: matrix.platform == 'mac'
        timeout-minutes: 2
        run: node --import tsx scripts/mac-update-signing-smoke.mts
      - run: bun run check
      - run: bun run typecheck:reference
      - run: bun run build
      - name: Verify Developer Portal isolation and lifecycle
        timeout-minutes: 2
        run: node --import tsx scripts/portal-smoke.mts
      - name: Exercise the RPC worker
        run: bun run test:rpc
      - name: Build installer and archive
        if: matrix.platform != 'mac' || !inputs.sign_macos
        run: bun x electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Build signed Mac release installer and archive
        if: matrix.platform == 'mac' && inputs.sign_macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          node --import tsx scripts/trust-mac-update-certificate.mts
          bun x electron-builder --mac --arm64 --publish never --config scripts/build/mac-release.cjs
      - name: Verify single-track updater metadata
        run: node --import tsx scripts/check-update-metadata.mts
      - name: Verify Mac release update signing compatibility
        if: matrix.platform == 'mac' && inputs.sign_macos
        env:
          EXCORD_MAC_SIGNING_CERTIFICATE: ${{ runner.temp }}/excord-update-certificate.pem
        run: node --import tsx scripts/check-mac-update-signing.mts
      - name: Exercise the packaged application archive
        run: bun run check:package
      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/js/*.js
            dist/js/*.css
            dist/js/*.map
            static/runtime/*.js
            static/runtime/*.css
            static/runtime/*.map
            static/runtime/modules.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify shutdown without an inspector
        timeout-minutes: 2
        run: node --import tsx scripts/quit-smoke.mts --packaged --refresh
      - name: Verify archive shutdown without an inspector
        timeout-minutes: 2
        run: node --import tsx scripts/quit-smoke.mts --archive --refresh
      - name: Verify installer, reinstallation, and session persistence
        timeout-minutes: 7
        run: node --import tsx scripts/install-smoke.mts
      - name: Exercise local plugins in Electron
        timeout-minutes: 5
        run: bun run test:electron
      - name: Exercise local plugins from the packaged archive
        timeout-minutes: 5
        run: bun run test:electron --packaged
      - name: Verify safe mode, offline recovery, and private diagnostics
        timeout-minutes: 4
        run: node --import tsx scripts/recovery-smoke.mts
      - name: Repeat profile reuse and recovery checks
        timeout-minutes: 4
        run: node --import tsx scripts/recovery-smoke.mts
      - name: Verify hidden efficiency, real WebRTC, and subframe isolation
        timeout-minutes: 3
        run: node --import tsx scripts/power-smoke.mts --packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: excord-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
            dist/alpha*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  favorites-dev-release:
    name: Publish Favorites development ZIPs
    if: github.event_name == 'workflow_dispatch' && inputs.favorites_dev_release && github.ref == 'refs/heads/feat/excord-favorites'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: excord-*
          path: artifacts
          merge-multiple: true
      - name: Prepare ZIP-only test release
        shell: bash
        run: |
          mkdir publish
          for platform in mac-arm64 win-x64; do
            archives=(artifacts/*-"$platform".zip)
            if [[ ${#archives[@]} != 1 || ! -f "${archives[0]}" ]]; then
              echo "Expected exactly one ZIP for $platform" >&2
              exit 1
            fi
            cp "${archives[0]}" "publish/ExcordFavorites-DEV-DO-NOT-INSTALL-$platform.zip"
          done
          cp scripts/favorites-dev-launch.command scripts/favorites-dev-launch.cmd publish/
          cp docs/favorites.md publish/TESTING.md
          git archive --format=tar.gz --prefix=excord/ --output=publish/Excord-source.tar.gz HEAD
          (cd publish && sha256sum * > SHA256SUMS)
          printf 'Commit: %s\n\n' "$GITHUB_SHA" > release-notes.md
          cat >> release-notes.md <<'EOF'
          # DEV DO NOT INSTALL - ExcordFavorites

          Branch test build. Native build and packaged smoke checks passed on macOS Apple silicon and Windows x64. Signed-in Favorites behavior still needs manual testing before merge.

          Download your platform's ZIP and matching launcher. Quit installed Excord completely, extract the ZIP into a test folder, and put the launcher beside Excord.app or excord.exe. Do not move the app into Applications or run an installer.

          On Mac, run `bash favorites-dev-launch.command` from Terminal in that folder. On Windows, double-click favorites-dev-launch.cmd. The launcher uses a separate excord-favorites-dev profile, so sign in again. Quit the test app before reopening installed Excord. Do not install updates from the test build.

          Quick check: add channels from two servers plus a DM, group DM, forum, thread, and voice channel; visit them while Favorites stays open; drag entries and categories; restart and check persistence; receive messages and mentions and compare badges with the original channels; check mute behavior; disable/re-enable the plugin. See TESTING.md for the full checklist.

          The app version matches the main-branch base. Identify this build by its commit and release tag. No installers or updater metadata are attached, and the dev tag is outside the normal update feed.
          EOF
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="dev-do-not-install-favorites-${GITHUB_SHA:0:12}"
          gh release create "$tag" publish/* --target "$GITHUB_SHA" --draft --prerelease --title "DEV DO NOT INSTALL - ExcordFavorites" --notes-file release-notes.md
          gh release edit "$tag" --draft=false --prerelease --latest=false

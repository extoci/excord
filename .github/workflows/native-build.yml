name: Native builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Verify release packaging with the persistent Mac signing certificate
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign_macos:
        description: Require the persistent self-signed certificate for release artifacts
        type: boolean
        default: false
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }} verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            runner: macos-26
            platform: mac
            arch: arm64
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Development builds use ad-hoc signing without secrets, including on PRs.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # macOS restores the install cache in ~7s; on Windows the archive
      # unpack costs 25-40s, more than a cold `bun install`.
      - name: Restore Bun install cache
        if: matrix.platform != 'win'
        id: cache-bun
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.arch }}-bun-install-${{ hashFiles('bun.lock') }}
      - name: Restore Electron packaging cache
        id: cache-electron
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-builder-${{ hashFiles('package.json', 'bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Verify self-signed Mac update compatibility without Apple credentials
        if: matrix.platform == 'mac'
        timeout-minutes: 2
        run: node --import tsx scripts/mac-update-signing-smoke.mts
      - run: bun run check
      - run: bun run typecheck:reference
      - run: bun run build
      - name: Verify Developer Portal isolation and lifecycle
        timeout-minutes: 2
        run: node --import tsx scripts/portal-smoke.mts
      - name: Exercise the RPC worker
        run: bun run test:rpc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore

  smokes:
    name: ${{ matrix.name }} smokes (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            runner: macos-26
            platform: mac
            arch: arm64
            suite: core
            checks: electron-dev,electron-packaged,power-subframe
          - name: macOS Apple silicon
            runner: macos-26
            platform: mac
            arch: arm64
            suite: lifecycle
            checks: shutdown-archive,shutdown-packaged,recovery,recovery-repeat
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
            suite: core
            checks: electron-dev,electron-packaged,power-subframe
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
            suite: lifecycle
            checks: shutdown-archive,shutdown-packaged,recovery,recovery-repeat
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Development builds use ad-hoc signing without secrets, including on PRs.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # macOS restores the install cache in ~7s; on Windows the archive
      # unpack costs 25-40s, more than a cold `bun install`.
      - name: Restore Bun install cache
        if: matrix.platform != 'win'
        id: cache-bun
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.arch }}-bun-install-${{ hashFiles('bun.lock') }}
      - name: Restore Electron packaging cache
        id: cache-electron
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-builder-${{ hashFiles('package.json', 'bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: bun run build
      - name: Build unpacked application
        # The packaged checks only need the unpacked app directory; installers
        # and archives are built by the parallel packaging job.
        run: bun x electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --dir
      - name: Exercise the packaged application archive
        run: bun run check:package
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'core'
        with:
          name: debug-symbols-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/js/*.js
            dist/js/*.css
            dist/js/*.map
            static/runtime/*.js
            static/runtime/*.css
            static/runtime/*.map
            static/runtime/modules.json
          if-no-files-found: error
          retention-days: 14
      # The packaged checks are independent: each spawns its own Electron
      # instance under a unique EXCORD_USER_DATA_DIR. run-smokes.mts runs them
      # four at a time; wider pools slow each Electron launch down more than
      # the extra slot saves. EXCORD_SMOKE_CONCURRENCY tunes it.
      - name: Exercise packaged application checks
        timeout-minutes: 10
        env:
          EXCORD_SMOKE_ONLY: ${{ matrix.checks }}
          EXCORD_SMOKE_CONCURRENCY: "4"
        run: node --import tsx scripts/run-smokes.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smokes-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore

  package:
    name: ${{ matrix.name }} packaging
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            runner: macos-26
            platform: mac
            arch: arm64
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Development builds use ad-hoc signing without secrets, including on PRs.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # macOS restores the install cache in ~7s; on Windows the archive
      # unpack costs 25-40s, more than a cold `bun install`.
      - name: Restore Bun install cache
        if: matrix.platform != 'win'
        id: cache-bun
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.arch }}-bun-install-${{ hashFiles('bun.lock') }}
      - name: Restore Electron packaging cache
        id: cache-electron
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-builder-${{ hashFiles('package.json', 'bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: bun run build
      - name: Build installer and archive
        # Development artifacts are verified and thrown away, so they do not
        # need maximum compression. The macOS ZIP alone spent ~6 minutes at
        # compression: maximum. Release builds keep package.json settings.
        if: ${{ !inputs.sign_macos }}
        run: bun x electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never --config scripts/build/ci-dev.cjs
      - name: Build release Windows installer and archive
        if: matrix.platform == 'win' && inputs.sign_macos
        run: bun x electron-builder --win --x64 --publish never
      - name: Build signed Mac release installer and archive
        if: matrix.platform == 'mac' && inputs.sign_macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          node --import tsx scripts/trust-mac-update-certificate.mts
          bun x electron-builder --mac --arm64 --publish never --config scripts/build/mac-release.cjs
      - name: Verify single-track updater metadata
        run: node --import tsx scripts/check-update-metadata.mts
      - name: Verify Mac release update signing compatibility
        if: matrix.platform == 'mac' && inputs.sign_macos
        env:
          EXCORD_MAC_SIGNING_CERTIFICATE: ${{ runner.temp }}/excord-update-certificate.pem
        run: node --import tsx scripts/check-mac-update-signing.mts
      - name: Exercise the installer
        timeout-minutes: 10
        env:
          EXCORD_SMOKE_ONLY: installer-persistence
        run: node --import tsx scripts/run-smokes.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-packaging-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: excord-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
            dist/alpha*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - name: Save Bun install cache
        if: github.event_name != 'pull_request' && matrix.platform != 'win' && steps.cache-bun.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.arch }}-bun-install-${{ hashFiles('bun.lock') }}
      - name: Save Electron packaging cache
        if: github.event_name != 'pull_request' && steps.cache-electron.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-builder-${{ hashFiles('package.json', 'bun.lock') }}
